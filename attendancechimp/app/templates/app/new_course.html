<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>New Course - AttendanceChimp</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin: 40px;
      }
      .form-container {
        max-width: 400px;
        margin: 0 auto;
        text-align: left;
      }
      h1,
      h2 {
        text-align: center;
      }
      .form-field {
        margin-bottom: 15px;
      }
      .form-field label {
        display: block;
        margin-bottom: 5px;
      }
      button {
        padding: 10px 20px;
        cursor: pointer;
      }
      .days-row {
        display: flex;
        gap: 15px;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <div class="form-container">
      <h1>AttendanceChimp</h1>
      <h2>Create Course</h2>

      <form action="/app/createCourse" method="POST">
        {% csrf_token %}

        <div class="form-field">
          <label for="course-name">Course Name:</label>
          <input type="text" id="course-name" name="course-name" required />
        </div>

        <div class="form-field">
          <label for="course-code">Course Code (optional):</label>
          <input
            type="text"
            id="course-code"
            name="course-code"
            placeholder="e.g. DATA13600"
            maxlength="20"
          />
        </div>

        <div class="form-field">
          <label for="start-time">Start Time:</label>
          <input type="time" id="start-time" name="start-time" required />
        </div>

        <div class="form-field">
          <label for="end-time">End Time:</label>
          <input type="time" id="end-time" name="end-time" required />
        </div>

        <p>Meeting Days:</p>

        <div class="days-row">
          <label
            ><input type="checkbox" name="day-mon" value="1" /> Monday</label
          >
          <label
            ><input type="checkbox" name="day-tue" value="1" /> Tuesday</label
          >
          <label
            ><input type="checkbox" name="day-wed" value="1" /> Wednesday</label
          >
        </div>

        <div class="days-row">
          <label
            ><input type="checkbox" name="day-thu" value="1" /> Thursday</label
          >
          <label
            ><input type="checkbox" name="day-fri" value="1" /> Friday</label
          >
        </div>

        <p><button type="submit">Create Course</button></p>
      </form>
    </div>
  </body>
</html>
