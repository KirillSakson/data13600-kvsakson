<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>QR Code Upload - AttendanceChimp</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin: 40px;
      }
      .form-container {
        max-width: 400px;
        margin: 0 auto;
        text-align: left;
      }
      h1,
      h2 {
        text-align: center;
      }
      button {
        padding: 10px 20px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="form-container">
      <h1>AttendanceChimp</h1>
      <h2>Upload QR Code</h2>

      <form
        action="/app/createQRCodeUpload"
        method="POST"
        enctype="multipart/form-data"
      >
        {% csrf_token %}

        <div class="form-field">
          <label for="imageUpload"> Select QR Code Image: </label>

          <input
            type="file"
            id="imageUpload"
            name="imageUpload"
            accept="image/*"
            required
          />
        </div>

        <p>
          <button type="submit">Upload QR Code</button>
        </p>
      </form>
    </div>
  </body>
</html>
