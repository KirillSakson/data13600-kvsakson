<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>New Lecture - AttendanceChimp</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin: 40px;
      }
      .form-container {
        max-width: 400px;
        margin: 0 auto;
        text-align: left;
      }
      h1,
      h2 {
        text-align: center;
      }
      button {
        padding: 10px 20px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="form-container">
      <h1>AttendanceChimp</h1>
      <h2>Create Lecture</h2>

      <form action="/app/createLecture" method="POST">
        {% csrf_token %}

        <label for="choice">Select Course:</label>

        <select id="choice" name="choice" required>
          {% for course in courses %}
          <option value="{{ course.name }}">{{ course.name }}</option>
          {% endfor %}
        </select>

        <div class="form-field">
          <label for="qrdata">QR Identifier (optional):</label>
          <input
            type="text"
            id="qrdata"
            name="qrdata"
            placeholder="Leave blank to generate automatically"
            maxlength="255"
          />
        </div>

        <p><button type="submit">Create Lecture</button></p>
      </form>
    </div>
  </body>
</html>
