<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AttendanceChimp - Log In</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin: 40px;
      }

      .form-container {
        max-width: 400px;
        margin: 0 auto;
        text-align: left;
      }

      h1,
      h2 {
        text-align: center;
      }

      .form-field {
        margin-bottom: 15px;
      }

      .form-field label {
        display: block;
        margin-bottom: 5px;
      }

      .form-field input {
        box-sizing: border-box;
        width: 100%;
        padding: 8px;
      }

      button {
        padding: 10px 20px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="form-container">
      <h1>AttendanceChimp</h1>
      <h2>Log In</h2>

      {% if form.errors %}
      <p>Invalid username or password. Please try again.</p>
      {% endif %}

      <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}

        <div class="form-field">
          <label for="username">Username:</label>
          <input type="text" id="username" name="username" required />
        </div>

        <div class="form-field">
          <label for="password">Password:</label>
          <input type="password" id="password" name="password" required />
        </div>

        <input type="hidden" name="next" value="{{ next }}" />

        <button type="submit">Log In</button>
      </form>
    </div>
  </body>
</html>
